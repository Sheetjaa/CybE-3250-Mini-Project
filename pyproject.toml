[project]
name = "cybe-3250-mini-project"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "matplotlib==3.10.8",
    "matplotlib-inline",
    "requests",
    "tiktoken",
    "pandas",
    "scipy",
    "pillow",
    "ipython",
    "transformers>=5.15.0",
    "accelerate>=1.14.0",
    "pygame-ce>=2.5,<3",
]

[project.optional-dependencies]
pytorch = [
    "torch==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.26.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "gymnasium[toy-text] ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "gpytorch ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "syne-tune[gpsearchers] ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
run = [
    "jupyter",
    "nbconvert",
    "ipykernel",
    "safetensors",
]
build = [
    "quarto-cli",
    "playwright",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
